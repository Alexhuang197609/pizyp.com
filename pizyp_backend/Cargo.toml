[package]
name = "pizyp"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web框架：关闭tls相关，仅保留接口必需特性
axum = { version = "0.7.9", default-features = false, features = ["json", "query", "macros", "http1", "tokio"] }
# 完全移除 axum-server、rustls-pemfile（SSL全部交由Apache反向代理，Axum只跑内网裸HTTP）

# 运行时：缩小tokio特性，替换full
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "net", "fs"] }

# 网络请求：移除无用blocking阻塞特性
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 跨域
tower-http = { version = "0.5", features = ["cors"] }

# SQLite数据库
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio", "chrono"] }

# 时间
chrono = { version = "0.4", features = ["serde", "std"] }

# 全局静态池（DB_POOL用，保留）
once_cell = "1.19"

# 图片Blob转码
base64 = "0.21"

# Stellar/Soroban合约解析（核心业务，不可删）
stellar-xdr = "26.0.1"
stellar-strkey = "0.0.16"
crc16 = "0.4"