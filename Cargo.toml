[package]
name = "pizyp"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7.9"
axum-server = { version= "0.7",features=["tls-rustls"] } # 启用rustls支持
rustls-pemfile = "1.0" #用于读取PEM格式证书/私
tokio = { version = "1.0", features = ["full"] }
#430
reqwest= { version ="0.11",features = ["json","rustls-tls","blocking"],default-features =false}
serde = {version ="1.0", features =["derive"]}
serde_json = "1.0"
tower-http = {version="0.5",features =["cors"]}
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio", "chrono"] }
chrono = { version = "0.4", features = ["serde", "std"] }
once_cell = "1.19"
base64 = "0.21"
